apiVersion: v1
kind: Namespace
metadata:
  name: rps-arena
  labels:
    app.kubernetes.io/part-of: rps-arena
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: rps-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: rps-arena
data:
  001-schema.sql: |
    CREATE TABLE IF NOT EXISTS games (
      session_id TEXT NOT NULL,
      game_key TEXT NOT NULL,
      id UUID NOT NULL UNIQUE,
      player_choice TEXT NOT NULL CHECK (player_choice IN ('rock', 'paper', 'scissors')),
      computer_choice TEXT NOT NULL CHECK (computer_choice IN ('rock', 'paper', 'scissors')),
      result TEXT NOT NULL CHECK (result IN ('win', 'draw', 'loss')),
      created_at TIMESTAMPTZ NOT NULL,
      PRIMARY KEY (session_id, game_key)
    );
    CREATE INDEX IF NOT EXISTS games_created_at_idx ON games (created_at DESC);
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rps-arena
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: rps-arena
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: rps-arena
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: rps-db
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rps-db
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: rps-db
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: rps-gp3
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: rps-api
  namespace: rps-arena
spec:
  selector:
    app: rps-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rps-api
  namespace: rps-arena
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rps-api
  template:
    metadata:
      labels:
        app: rps-api
        app.kubernetes.io/part-of: rps-arena
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
      containers:
        - name: api
          image: REPLACE_API_IMAGE
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rps-db
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rps-web
  namespace: rps-arena
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rps-web
  template:
    metadata:
      labels:
        app: rps-web
        app.kubernetes.io/part-of: rps-arena
    spec:
      containers:
        - name: web
          image: REPLACE_WEB_IMAGE
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rps-web
  namespace: rps-arena
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  type: LoadBalancer
  selector:
    app: rps-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
