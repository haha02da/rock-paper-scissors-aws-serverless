apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rps-arena
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/haha02da/rock-paper-scissors-aws-serverless.git
    targetRevision: main
    path: infrastructure
  destination:
    server: https://kubernetes.default.svc
    namespace: rps-arena
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: rps-api
      namespace: rps-arena
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: rps-web
      namespace: rps-arena
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  revisionHistoryLimit: 10
