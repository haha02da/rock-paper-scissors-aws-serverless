services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rps
      POSTGRES_PASSWORD: rps-local-only
      POSTGRES_DB: rps
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/eks/local-init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rps -d rps"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://rps:rps-local-only@postgres:5432/rps
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
        aliases:
          - rps-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: /api
        NEXT_PUBLIC_SITE_URL: http://localhost:8080
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
